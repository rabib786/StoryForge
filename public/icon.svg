  <!-- Inner Flame Core -->
  <path d="M256 160 C267 190 290 215 290 242 C290 262 274 278 256 278 C238 278 222 262 222 242 C222 215 245 190 256 160 Z" fill="#fef3c7" opacity="0.9" />

